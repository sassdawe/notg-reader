apiVersion: apps/v1
kind: Deployment
metadata:
  name: notg-reader
  namespace: notg-reader
  labels:
    app: notg-reader
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notg-reader
  template:
    metadata:
      labels:
        app: notg-reader
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: notg-reader
          image: notg-reader:latest
          ports:
            - containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: notg-reader-config
            - secretRef:
                name: notg-reader-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notg-reader-data
